[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "processtensor"
description = "Minimal numerical process tensors: multi-time quantum processes, validity checks, and temporal correlation measures."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "John Fidel Kam", email = "jfidelkam@gmail.com" }]
keywords = [
  "process tensor",
  "quantum information",
  "open quantum systems",
  "non-Markovianity",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]
examples = ["matplotlib"]

[tool.hatch.version]
path = "src/processtensor/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/processtensor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["deprecated"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 80
